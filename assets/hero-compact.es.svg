<text x="360" y="152" font-size="17" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="3.4">PLUGIN OFICIAL PARA cPANEL Y WHM</text>
<text x="360" y="226" font-size="52" font-weight="700" fill="#f5f5ff" text-anchor="middle" letter-spacing="-0.6">Migra cuentas cPanel</text>
<text x="360" y="288" font-size="52" font-weight="700" fill="#f5f5ff" text-anchor="middle" letter-spacing="-0.6">a BladeCP.</text>
<text x="360" y="338" font-size="24" fill="#a5a6c9" text-anchor="middle">Desde tu WHM, sin cambiar</text>
