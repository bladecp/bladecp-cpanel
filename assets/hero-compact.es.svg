<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" role="img" aria-labelledby="title desc">
<title id="title">BladeCP cPanel Migrator</title>
<desc id="desc">Plugin oficial de código abierto para cPanel y WHM. Migra cuentas cPanel a BladeCP desde tu WHM, en lote, con vista previa antes de aprobar, cobro por tu WHMCS y una app en el cPanel de tus clientes.</desc>
<style>.sweep-core{animation:bcp-core 12s cubic-bezier(.45,0,.55,1) -6s infinite alternate}.sweep-glow{animation:bcp-glow 12s cubic-bezier(.45,0,.55,1) -6s infinite alternate}.atmo{animation:bcp-atmo 9s ease-in-out infinite}@keyframes bcp-core{from{stroke-dashoffset:-134.9px}to{stroke-dashoffset:-674.97px}}@keyframes bcp-glow{from{stroke-dashoffset:-91.9px}to{stroke-dashoffset:-631.97px}}@keyframes bcp-atmo{50%{opacity:.78}}@media (prefers-reduced-motion:reduce){.sweep-core,.sweep-glow,.atmo{animation:none}}</style>
