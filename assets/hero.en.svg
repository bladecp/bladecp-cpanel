<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">BladeCP cPanel Migrator</title>
<desc id="desc">Official open-source plugin for cPanel and WHM. Migrate cPanel accounts to BladeCP from your WHM, in batches, with a preview before you approve, billing through your WHMCS and an app in the cPanel of your customers.</desc>
<style>.sweep-core{animation:bcp-core 12s cubic-bezier(.45,0,.55,1) -6s infinite alternate}.sweep-glow{animation:bcp-glow 12s cubic-bezier(.45,0,.55,1) -6s infinite alternate}.atmo{animation:bcp-atmo 9s ease-in-out infinite}@keyframes bcp-core{from{stroke-dashoffset:-236.01px}to{stroke-dashoffset:-1135.59px}}@keyframes bcp-glow{from{stroke-dashoffset:-193.01px}to{stroke-dashoffset:-1092.59px}}@keyframes bcp-atmo{50%{opacity:.78}}@media (prefers-reduced-motion:reduce){.sweep-core,.sweep-glow,.atmo{animation:none}}</style>
