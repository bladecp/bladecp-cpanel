name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Check PHP syntax
        run: find plugin tests -type f \( -name '*.php' -o -name '*.cgi' \) -print0 | xargs -0 -n1 php -l

      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh scripts/check-public-tree.sh tests/install/run.sh tests/perl/run.sh

      - name: Run public regression checks
        run: php tests/run.php

      - name: Check the cPanel API module and AdminBin (Perl)
        run: bash tests/perl/run.sh

      - name: Install and uninstall on a fake filesystem root
        run: PHP=php bash tests/install/run.sh

      - name: Check public structure and hygiene
        run: bash scripts/check-public-tree.sh
